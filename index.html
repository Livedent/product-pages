<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세페이지 미리보기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            padding-top: 10vh;
            padding-bottom: 120px;
            min-height: 100vh;
        }
        .wrapper {
            width: 600px;
        }
        .wrapper img {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="wrapper" id="wrapper"></div>
    <script>
        // 🔧 이미지 파일명을 순서대로 나열
        const IMAGE_FILES = [
            '0.gif',
            '1.jpg',
            '2-1.jpg',
            '2-2.jpg',
            '3.jpg',
            '4.jpg',
            '5-1.jpg',
            '5-2.gif',
            '5-3.gif',
            '5-4.jpg',
            '6.jpg',
            '7-1.jpg',
            '7-2.mp4',
            '7-3.jpg',
            '8-1.jpg',
            '8-2.gif',
            '8-3.jpg',
            '9.jpg',
            '10.jpg',
            '11.jpg',
            '12.jpg',
            '13-1.jpg',
            '13-2.mp4',
            '14.jpg',
            '15.jpg',
            '16-1.jpg',
            '16-2.gif',
            '16-3.gif',
            '17-1.jpg',
            '17-2.gif',
            '17-3.gif',
            '17-4.gif',
            '17-5.gif',
            '17-6.jpg',
            '18-1.jpg',
            '18-2.gif',
            '18-3.jpg',
            '19.jpg',
            '20-1.gif',
            '20-2.gif',
            '20-3.gif',
            '20-4.gif',
            '20-5.jpg',
            '21.jpg',
            '22.jpg',
            '23.jpg',
            '24.jpg',
            '25.jpg',
            '26.jpg',
        ];

        const VIDEO_EXT = ['mp4', 'webm', 'mov'];
        const wrapper = document.getElementById('wrapper');

        IMAGE_FILES.forEach(file => {
            const ext = file.split('.').pop().toLowerCase();
            let el;

            if (VIDEO_EXT.includes(ext)) {
                el = document.createElement('video');
                el.src = `images/${file}`;
                el.autoplay = true;
                el.muted = true;
                el.loop = true;
                el.playsInline = true;
                el.preload = 'metadata';
            } else {
                el = document.createElement('img');
                el.src = `images/${file}`;
                el.alt = file;
                el.loading = 'lazy';
            }
            wrapper.appendChild(el);
        });
    </script>
</body>
</html>
